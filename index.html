<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="HANA - first person survival horror in one luxury apartment room, playable in your mobile browser." />
    <title>HANA — Kamar 14B</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Screen-space horror grade: sits between the canvas and the HUD. -->
    <div id="fx-layer" aria-hidden="true">
      <div class="fx-grade"></div>
      <div class="fx-vignette"></div>
      <div class="fx-scanlines"></div>
      <div class="fx-grain"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
